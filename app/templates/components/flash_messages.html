{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="flash-messages-container mb-3">
            {% for category, message in messages %}
                <div class="alert alert-{{ category if category != 'message' else 'info' }} alert-dismissible fade show rounded-4 shadow-sm border-0 d-flex align-items-center" role="alert">
                    {% if category == 'success' %}
                        <i class="bi bi-check-circle-fill text-success fs-5 me-2"></i>
                    {% elif category == 'danger' %}
                        <i class="bi bi-exclamation-triangle-fill text-danger fs-5 me-2"></i>
                    {% elif category == 'warning' %}
                        <i class="bi bi-exclamation-circle-fill text-warning fs-5 me-2"></i>
                    {% else %}
                        <i class="bi bi-info-circle-fill text-info fs-5 me-2"></i>
                    {% endif %}
                    <div class="flex-grow-1">{{ message }}</div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}
